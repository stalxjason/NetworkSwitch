name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # 仓库在 Windows 上维护（core.fileMode=false），wrapper 脚本可能丢可执行位。
      # 这里兜底，避免再次出现 ./gradlew: Permission denied。
      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # ubuntu 镜像不带 compileSdk 36 的 platform，AGP 自动下载也容易卡在
      # build-tools 版本或 license 上，这里显式装。
      # 若 @v3 解析失败，退回 @v2。
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;34.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # wrapper 锁定 Gradle 8.9；用 ./gradlew 而不是 gradle，避免 runner 预装版本漂移
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Run lint
        run: ./gradlew lintDebug

      # 自用项目：只产出 debug 包，不做 release 签名
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: network-switch-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
